  <rect x="4" y="4" width="120" height="120" rx="26" fill="#4F46E5"/>
  <circle cx="56" cy="56" r="28" fill="none" stroke="#FFFFFF" stroke-width="14"/>
  <circle cx="56" cy="56" r="11" fill="#FFFFFF"/>
  <line x1="78" y1="78" x2="100" y2="100" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
</svg>
